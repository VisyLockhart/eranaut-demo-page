<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aequor Eranos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #2dd4bf;
    --accent-dark: #0e7490;
    --amber: #fbbf24;
    --danger: #f87171;
    --discord: #5865f2;
    --discord-dark: #4752c4;
    --bg: #070a14;
    --bg-elevated: #0f1526;
    --bg-elevated-2: #0d1220;
    --border: rgba(148,163,184,0.10);
    --border-strong: rgba(148,163,184,0.16);
    --text: #e6eaf5;
    --text-muted: #8b93ab;
    --text-dim: #6b7594;
    --text-faint: #4a5273;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Sora', sans-serif;
    color: var(--text);
    background: radial-gradient(120% 70% at 15% -10%, #10213a 0%, #070a14 55%), #070a14;
    min-height: 100vh;
  }
  button, select, input { font-family: inherit; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; text-decoration: none; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.75); }
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  .pulse-dot { animation: pulse-dot 2.2s ease-in-out infinite; }
  .pulse-ring { animation: pulse-ring 2.2s ease-out infinite; }

  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(155deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #1a2138;
    border: 1px solid var(--border-strong); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 600; color: var(--text-muted);
    flex: 0 0 auto;
  }

  .icon-btn {
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--text-dim); border-radius: 50%;
  }
  .icon-btn.active { background: var(--accent); color: #04121a; }

  .pill-toggle {
    display: flex; gap: 4px; background: var(--bg-elevated-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px;
  }

  .dropzone {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 100%; border: 2px dashed rgba(148,163,184,0.22); border-radius: 16px;
    background: var(--bg-elevated-2); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .dropzone.drag { border-color: var(--accent); background: rgba(45,212,191,0.06); }
  .dropzone.has-file { border-color: rgba(45,212,191,0.45); background: rgba(45,212,191,0.05); }
  .dropzone input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

  /* ---------- Mobile shell ---------- */
  .mobile-shell {
    display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
    min-height: 100vh;
  }
  .m-header {
    flex: 0 0 auto; padding: 20px 18px 14px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .m-stats { flex: 0 0 auto; padding: 12px 18px; display: flex; gap: 10px; }
  .m-stat { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .m-stat.ready { flex: 1.3; background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.30); }
  .m-stat .num { font-size: 17px; font-weight: 700; }
  .m-stat .label { font-size: 10.5px; color: var(--text-dim); margin-top: 1px; }
  .m-stat.ready .num { color: var(--amber); }
  .m-stat.ready .label { color: #d8a94c; }

  .pager { flex: 0 0 auto; padding: 2px 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pager-row { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; }
  .pager-btn { width: 34px; height: 34px; border-radius: 10px; background: var(--bg-elevated); border: 1px solid rgba(148,163,184,0.12); color: var(--text-muted); }
  .pager-label { flex-grow: 1; text-align: center; font-size: 14px; font-weight: 700; }
  .pager-dots { display: flex; align-items: center; gap: 5px; }
  .dot { height: 5px; border-radius: 3px; background: #2a3150; width: 5px; }
  .dot.active { width: 16px; background: var(--accent); }

  .ws-context-line { padding: 0 18px 8px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .m-viewswitch { flex: 0 0 auto; padding: 0 18px 10px; display: flex; align-items: center; justify-content: space-between; }
  .sort-label { font-size: 10.5px; color: var(--text-faint); }

  .m-list { flex-grow: 1; overflow-y: auto; padding: 0 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 1px; border-radius: 10px; border: 1px solid rgba(148,163,184,0.08); }
  .row.ready { background: rgba(251,191,36,0.06); border-color: rgba(251,191,36,0.22); }
  .row-dot-wrap { width: 9px; height: 9px; flex: 0 0 auto; position: relative; display: flex; align-items: center; justify-content: center; }
  .row-dot { width: 9px; height: 9px; border-radius: 50%; position: relative; z-index: 1; }
  .row-ring { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; }
  .row-main { flex-grow: 1; min-width: 0; }
  .row-sub { font-size: 14.5px; font-weight: 600; line-height: 1.25; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-ws { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .row-right { text-align: right; flex: 0 0 auto; }
  .row-time { font-size: 14.5px; font-weight: 600; line-height: 1.25; }
  .row-status { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

  .m-cards { flex-grow: 1; overflow-y: auto; padding: 0 18px; }
  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .card.ready { background: rgba(251,191,36,0.07); border-color: rgba(251,191,36,0.30); }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-ws { font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.03em; }
  .status-pill { display: flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(45,212,191,0.10); color: var(--accent); }
  .status-pill.ready { background: rgba(251,191,36,0.14); color: var(--amber); }
  .pill-dot-wrap { width: 7px; height: 7px; position: relative; display: flex; align-items: center; justify-content: center; }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; position: relative; z-index: 1; }
  .pill-ring { position: absolute; width: 6px; height: 6px; border-radius: 50%; border: 1.3px solid; }
  .card-sub { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  .card-bottom { display: flex; align-items: baseline; justify-content: space-between; }
  .card-time { font-size: 22px; font-weight: 600; }
  .card-hint { font-size: 10.5px; color: var(--text-faint); }

  .m-nav { flex: 0 0 auto; display: flex; align-items: stretch; border-top: 1px solid var(--border); background: #0a0e1c; }
  .nav-item { flex: 1; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5b6488; cursor: pointer; }
  .nav-item.active { color: var(--accent); }
  .nav-item span { font-size: 10px; font-weight: 500; }
  .nav-item.active span { font-weight: 600; }
  .nav-upload { position: relative; }
  .nav-upload-fab {
    position: absolute; top: -18px; width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(155deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(45,212,191,0.35);
  }
  .nav-upload span { margin-top: 24px; }

  .m-upload-body { flex-grow: 1; overflow-y: auto; padding: 20px 18px; }
  .field-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field-select { width: 100%; padding: 11px 14px; border-radius: 9px; background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text); font-size: 13.5px; }
  .divider-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .divider-line { flex-grow: 1; height: 1px; background: var(--border-strong); }
  .camera-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 11px; background: var(--bg-elevated); border: 1px solid var(--border-strong); cursor: pointer; }
  .primary-btn { padding: 13px; border-radius: 10px; border: none; background: linear-gradient(155deg, var(--accent), var(--accent-dark)); color: #04121a; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; }
  .ghost-btn { padding: 11px; border-radius: 10px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }

  /* ---------- Desktop shell ---------- */
  .desktop-shell { display: none; }
  .d-wrap { max-width: 1280px; margin: 0 auto; display: flex; min-height: 100vh; }
  .d-sidebar { width: 232px; flex: 0 0 auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 22px 14px; }
  .d-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; }
  .d-brand-name { font-size: 13.5px; font-weight: 700; letter-spacing: 0.05em; }
  .d-brand-sub { font-size: 10.5px; color: var(--text-dim); margin-top: 1px; }
  .d-nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 500; }
  .d-nav-item.active { background: rgba(45,212,191,0.10); color: var(--accent); font-weight: 600; }
  .d-user { display: flex; align-items: center; gap: 9px; padding: 10px; border-radius: 10px; background: var(--bg-elevated); border: 1px solid var(--border); }
  .d-user-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-user-sub { font-size: 10.5px; color: var(--text-dim); }

  .d-main { flex-grow: 1; padding: 26px 32px; overflow-y: auto; min-width: 0; }
  .d-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 16px; flex-wrap: wrap; }
  .d-title { font-size: 20px; font-weight: 700; }
  .d-subtitle { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .d-pager { display: flex; align-items: center; gap: 4px; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px; }
  .d-pager-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .d-pager-label { min-width: 88px; text-align: center; font-size: 13px; font-weight: 700; }

  .d-stats { display: flex; gap: 14px; margin-bottom: 22px; }
  .d-stat { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
  .d-stat.ready { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.30); }
  .d-stat.wide { flex: 1.6; }
  .d-stat .num { font-size: 24px; font-weight: 700; }
  .d-stat .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .d-stat.ready .num { color: var(--amber); }
  .d-stat.ready .label { color: #d8a94c; }

  .upload-cta { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 9px; background: linear-gradient(155deg, var(--accent), var(--accent-dark)); color: #04121a; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }

  .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-head, .table-row {
    display: grid; grid-template-columns: 28px 1.6fr 1.3fr 1fr 1.1fr 1fr; gap: 8px; align-items: center; padding: 11px 16px;
  }
  .table-head { padding: 10px 16px; background: var(--bg-elevated-2); font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: 0.02em; }
  .table-row { border-top: 1px solid rgba(148,163,184,0.06); }
  .table-row.ready { background: rgba(251,191,36,0.06); }
  .t-sub { font-size: 13.5px; font-weight: 600; }
  .t-ws { font-size: 12.5px; color: var(--text-muted); }
  .t-status { font-size: 12.5px; color: var(--text-muted); }
  .t-status.ready { color: #d8a94c; }
  .t-time { font-size: 13px; font-weight: 600; }
  .t-eta { font-size: 12.5px; color: var(--text-dim); }

  .card-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .d-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; padding: 16px 15px; display: flex; flex-direction: column; min-height: 190px; }
  .d-card.ready { background: rgba(251,191,36,0.07); border-color: rgba(251,191,36,0.30); }
  .d-card-pos { font-size: 10.5px; color: var(--text-faint); }
  .d-card-sub { font-size: 15px; font-weight: 700; margin: 2px 0; }
  .d-card-ws { font-size: 11.5px; color: var(--text-dim); }
  .d-card-spacer { flex-grow: 1; min-height: 14px; }
  .d-card-hint { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }
  .d-card-bottom { border-top: 1px solid rgba(148,163,184,0.08); padding-top: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .d-card-time { font-size: 18px; font-weight: 600; }
  .d-card-eta { font-size: 11px; color: var(--text-faint); }
  .d-card-eta-full { font-size: 10px; color: var(--text-faint); margin-top: 1px; }

  .d-upload-wrap { max-width: 720px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12.5px; margin-bottom: 16px; cursor: pointer; }

  /* ---------- Workshop management ---------- */
  .ws-browse-item { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: var(--bg-elevated); border: 1px solid var(--border); cursor: pointer; }
  .ws-icon { width: 44px; height: 44px; border-radius: 10px; background: rgba(45,212,191,0.12); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--accent); }
  .ws-row { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: var(--bg-elevated); border: 1px solid var(--border); }
  .ws-row.dragging { opacity: 0.4; }
  .ws-drag-handle { cursor: grab; display: flex; flex: 0 0 auto; }
  .ws-drag-handle:active { cursor: grabbing; }
  .ws-arrows { display: flex; flex-direction: column; gap: 2px; flex: 0 0 auto; }
  .ws-arrow-btn { width: 26px; height: 18px; border-radius: 5px; background: var(--bg-elevated-2); border: 1px solid var(--border-strong); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .ws-arrow-btn:disabled { color: var(--text-faint); cursor: not-allowed; }
  .ws-icon-btn { width: 34px; height: 34px; border-radius: 8px; background: var(--bg-elevated-2); border: 1px solid var(--border-strong); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; }
  .ws-icon-btn.danger { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.3); color: var(--danger); }
  .ws-add-btn { margin-top: 4px; padding: 14px; border-radius: 14px; background: transparent; border: 1.5px dashed var(--border-strong); color: var(--accent); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; width: 100%; }

  /* ---------- Address tooltip (desktop) ---------- */
  .ws-tooltip-wrap { position: relative; }
  .ws-tooltip-bubble { position: absolute; left: 0; bottom: calc(100% + 10px); background: #0d1220; border: 1px solid var(--border-strong); color: var(--text); font-size: 11.5px; padding: 8px 11px; border-radius: 9px; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity .12s, transform .12s; box-shadow: 0 10px 28px rgba(0,0,0,0.45); z-index: 30; }
  .ws-tooltip-wrap:hover .ws-tooltip-bubble { opacity: 1; transform: translateY(0); }
  .ws-notify-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--accent); background: rgba(45,212,191,0.10); padding: 1px 7px; border-radius: 999px; margin-left: 6px; }

  /* ---------- Modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(3,6,14,0.72); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal-box { width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 18px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal-section-label { font-size: 11px; color: var(--text-faint); font-weight: 600; letter-spacing: 0.04em; margin: 18px 0 8px; }
  .modal-field-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .modal-field-row .modal-input { margin-bottom: 0; }
  .modal-toggle-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; background: var(--bg-elevated-2); border: 1px solid var(--border); border-radius: 12px; }
  .switch { position: relative; display: inline-block; width: 40px; height: 23px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 999px; cursor: pointer; transition: .15s; }
  .switch .slider:before { content: ""; position: absolute; height: 17px; width: 17px; left: 2px; top: 2px; background: var(--text-dim); border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: rgba(45,212,191,0.22); border-color: var(--accent); }
  .switch input:checked + .slider:before { transform: translateX(17px); background: var(--accent); }
  .modal-box.danger { border-color: rgba(248,113,113,0.35); }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close { width: 30px; height: 30px; border-radius: 8px; background: var(--bg-elevated-2); border: 1px solid var(--border-strong); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; }
  .modal-input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1.5px solid var(--accent); color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .modal-input.error { border-color: var(--danger); }
  .field-select.error-select { border-color: var(--danger); }
  .modal-hint { font-size: 12px; color: var(--text-dim); }
  .modal-error-text { font-size: 12px; color: var(--danger); margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-secondary { flex: 1; padding: 12px; border-radius: 10px; background: var(--bg-elevated-2); border: 1px solid var(--border-strong); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary-modal { flex: 1; padding: 12px; border-radius: 10px; background: var(--accent); border: none; color: #06251f; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-danger { flex: 1; padding: 12px; border-radius: 10px; background: var(--danger); border: none; color: #2a0a0a; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* ---------- Auth flow ---------- */
  .auth-page-m { flex-grow: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 44px 24px 32px; overflow-y: auto; }
  .auth-page-d { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 56px 40px; background: radial-gradient(circle at 50% -10%, #10213a 0%, var(--bg) 55%); }
  .auth-logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .auth-logo-row .d-brand-name { font-size: 16px; }
  .auth-hero-title-m { font-size: 25px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
  .auth-hero-title-d { font-size: 42px; font-weight: 700; line-height: 1.25; text-align: center; margin-bottom: 16px; max-width: 720px; }
  .auth-hero-sub-m { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
  .auth-hero-sub-d { font-size: 15px; color: var(--text-muted); text-align: center; line-height: 1.6; margin-bottom: 48px; max-width: 520px; }
  .discord-btn { padding: 15px 32px; border-radius: 12px; border: none; background: var(--discord); color: #ffffff; font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; width: 100%; }
  .discord-btn:hover { background: var(--discord-dark); }
  .auth-features-m { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 36px; }

  // ---------- Modal ----------
  function renderModal() {
    if (!state.modal) return '';

    if (state.modal.type === 'form') {
      var isEditing = !!state.modal.id;
      var current = isEditing ? WORKSHOPS.filter(function (w) { return w.id === state.modal.id; })[0] : null;
      var d = state.modal.draft || {
        name: current ? current.name : '',
        server: current ? current.server : '',
        captain: current ? current.captain : '',
        district: current && current.address ? current.address.district : '',
        ward: current && current.address ? current.address.ward : '',
        detail: current && current.address ? current.address.detail : '',
        notifyBatched: current ? !!current.notifyBatched : false
      };
      var nameError = state.modalError === '請輸入工坊名稱' || state.modalError === '此名稱已存在';
      var serverError = state.modalError === '請選擇遊戲伺服器';
      return (
        '<div class="modal-overlay" data-action="modal-cancel">' +
          '<div class="modal-box" data-action="modal-noop">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
              '<div class="modal-title">' + (isEditing ? '編輯工坊' : '新增工坊') + '</div>' +
              '<button class="modal-close" data-action="modal-cancel" aria-label="關閉">' + svgClose() + '</button>' +
            '</div>' +
            '<label class="field-label">公會名稱（可自訂別名）</label>' +
            '<input type="text" id="ws-name-input" class="modal-input' + (nameError ? ' error' : '') + '" value="' + esc(d.name) + '" maxlength="20">' +
            (nameError
              ? '<div class="modal-error-text">' + esc(state.modalError) + '</div>'
              : '<div class="modal-hint">填公會正式名稱，或自己取一個好記的別名——用來在潛艇列表裡辨識這是哪個公會的紀錄，同一份清單裡不要重複比較好分辨</div>') +

            '<div class="modal-section-label">遊戲身分</div>' +
            '<div class="modal-field-row">' +
              '<div style="flex:1;"><label class="field-label">伺服器<span style="color:var(--danger);">＊</span></label><select id="ws-server-input" class="field-select' + (serverError ? ' error-select' : '') + '" style="padding:12px 14px;">' +
                '<option value="">請選擇</option>' +
                SERVERS.map(function (sv) { return '<option value="' + esc(sv) + '"' + (d.server === sv ? ' selected' : '') + '>' + esc(sv) + '</option>'; }).join('') +
              '</select></div>' +
              '<div style="flex:1;"><label class="field-label">代表角色（收艇，選填）</label><input type="text" id="ws-captain-input" class="modal-input" style="margin-bottom:0;" placeholder="例如：芙寧娜" value="' + esc(d.captain) + '" maxlength="20"></div>' +
            '</div>' +
            (serverError
              ? '<div class="modal-error-text">' + esc(state.modalError) + '</div>'
              : '<div class="modal-hint">同一個人的多間公會可能在不同伺服器、由不同角色負責收艇，這裡標記清楚比較不會跑錯</div>') +

            '<div class="modal-section-label">公會屋地址（選填，僅工坊管理內部使用，不會顯示在總覽）</div>' +
            '<div class="modal-field-row">' +
              '<div style="flex:1.4;"><label class="field-label">住宅區</label><select id="ws-district-select" class="field-select" style="padding:12px 14px;">' +
                '<option value="">請選擇</option>' +
                DISTRICTS.map(function (dist) { return '<option value="' + esc(dist) + '"' + (d.district === dist ? ' selected' : '') + '>' + esc(dist) + '</option>'; }).join('') +
              '</select></div>' +
              '<div style="flex:0.7;"><label class="field-label">房區</label><input type="number" id="ws-ward-input" class="modal-input" style="margin-bottom:0;" placeholder="例如：15" value="' + esc(d.ward) + '"></div>' +
            '</div>' +
            '<label class="field-label">詳細地址</label>' +
            '<input type="text" id="ws-detail-input" class="modal-input" placeholder="例如：51巷2號" value="' + esc(d.detail) + '" maxlength="30">' +

            '<div class="modal-toggle-row">' +
              '<label class="switch"><input type="checkbox" id="ws-notify-toggle"' + (d.notifyBatched ? ' checked' : '') + '><span class="slider"></span></label>' +
              '<div><div style="font-size:13px;font-weight:600;">等全部潛艇返航才一起提醒</div><div style="font-size:11.5px;color:var(--text-dim);margin-top:2px;">關閉時，這個工坊底下每艘潛艇返航都會分別提醒</div></div>' +
            '</div>' +

            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="modal-cancel">取消</button>' +
              '<button class="btn-primary-modal" data-action="modal-save" data-id="' + (isEditing ? state.modal.id : '') + '">' + (isEditing ? '儲存' : '新增') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    if (state.modal.type === 'delete') {
      var w = WORKSHOPS.filter(function (x) { return x.id === state.modal.id; })[0];
      if (!w) return '';
      var stats = workshopStats(w.name);
      var count = stats.exploring + stats.ready;
      return (
        '<div class="modal-overlay" data-action="modal-cancel">' +
          '<div class="modal-box danger" data-action="modal-noop">' +
            (count > 0 ? '<div style="width:48px;height:48px;border-radius:12px;background:rgba(248,113,113,0.12);display:flex;align-items:center;justify-content:center;margin-bottom:16px;">' + svgWarning() + '</div>' : '') +
            '<div class="modal-title" style="margin-bottom:10px;">刪除工坊</div>' +
            '<div style="font-size:14px;line-height:1.6;color:var(--text-muted);margin-bottom:24px;">' +
              (count > 0
                ? '工坊「<span style="color:var(--text);font-weight:600;">' + esc(w.name) + '</span>」底下還有 <span style="color:' + DANGER + ';font-weight:700;">' + count + ' 艘</span> 潛艇記錄，刪除工坊會<span style="color:var(--text);font-weight:600;">一併刪除這些記錄</span>，此動作無法復原。'
                : '確定要刪除「<span style="color:var(--text);font-weight:600;">' + esc(w.name) + '</span>」嗎？這個工坊底下目前沒有潛艇記錄。') +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="modal-cancel">取消</button>' +
              '<button class="btn-danger" data-action="modal-delete-confirm" data-id="' + w.id + '">確認刪除</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    return '';
  }

  function render() {
    var mobileHtml, desktopHtml, extra;
    if (state.authState !== 'authenticated') {
      if (state.authState === 'landing') { mobileHtml = renderAuthLandingMobile(); desktopHtml = renderAuthLandingDesktop(); }
      else if (state.authState === 'processing') { mobileHtml = renderAuthProcessingMobile(); desktopHtml = renderAuthProcessingDesktop(); }
      else if (state.authState === 'denied') { mobileHtml = renderAuthDeniedMobile(); desktopHtml = renderAuthDeniedDesktop(); }
      else { mobileHtml = renderAuthExpiredMobile(); desktopHtml = renderAuthExpiredDesktop(); }
      extra = '';
    } else {
      if (state.route === 'overview') { mobileHtml = renderMobileOverview(); desktopHtml = renderDesktopOverview(); }
      else if (state.route === 'upload') { mobileHtml = renderMobileUpload(); desktopHtml = renderDesktopUpload(); }
      else { mobileHtml = renderMobileWorkshops(); desktopHtml = renderDesktopWorkshops(); }
      extra = renderModal();
    }
    document.getElementById('app').innerHTML = mobileHtml + '<div class="desktop-shell">' + desktopHtml + '</div>' + extra + devPanel();
  }

  function handleFile(fileName) {
    state.fileName = fileName || '潛艇截圖.png';
    state.dragActive = false;
    render();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'view-list') state.view = 'list';
    else if (action === 'view-card') state.view = 'card';
    else if (action === 'ws-prev') state.wsIndex = (state.wsIndex - 1 + pagerItems().length) % pagerItems().length;
    else if (action === 'ws-next') state.wsIndex = (state.wsIndex + 1) % pagerItems().length;
    else if (action === 'nav-overview') { state.route = 'overview'; state.modal = null; }
    else if (action === 'nav-upload') { state.route = 'upload'; state.modal = null; }
    else if (action === 'nav-workshops') { state.route = 'workshops'; state.modal = null; }
    else if (action === 'upload-reset') { state.fileName = null; }
    else if (action === 'ws-manage-toggle') { state.wsManageMode = !state.wsManageMode; }
    else if (action === 'ws-goto') {
      var gid = el.getAttribute('data-id');
      var gw = WORKSHOPS.filter(function (w) { return w.id === gid; })[0];
      if (gw) {
        var idx = pagerItems().indexOf(gw.name);
        state.route = 'overview';
        state.wsIndex = idx >= 0 ? idx : 0;
      }
    }
    else if (action === 'ws-move-up') {
      var upId = el.getAttribute('data-id');
      var upIdx = WORKSHOPS.map(function (w) { return w.id; }).indexOf(upId);
      if (upIdx > 0) {
        var tmpUp = WORKSHOPS[upIdx - 1];
        WORKSHOPS[upIdx - 1] = WORKSHOPS[upIdx];
        WORKSHOPS[upIdx] = tmpUp;
      }
    }
    else if (action === 'ws-move-down') {
      var dnId = el.getAttribute('data-id');
      var dnIdx = WORKSHOPS.map(function (w) { return w.id; }).indexOf(dnId);
      if (dnIdx >= 0 && dnIdx < WORKSHOPS.length - 1) {
        var tmpDn = WORKSHOPS[dnIdx + 1];
        WORKSHOPS[dnIdx + 1] = WORKSHOPS[dnIdx];
        WORKSHOPS[dnIdx] = tmpDn;
      }
    }
    else if (action === 'ws-add') { state.modal = { type: 'form', id: null }; state.modalError = null; }
    else if (action === 'ws-edit') { state.modal = { type: 'form', id: el.getAttribute('data-id') }; state.modalError = null; }
    else if (action === 'ws-delete') { state.modal = { type: 'delete', id: el.getAttribute('data-id') }; }
    else if (action === 'modal-noop') { return; }
    else if (action === 'modal-cancel') { state.modal = null; state.modalError = null; }
    else if (action === 'modal-save') {
      var input = document.getElementById('ws-name-input');
      var val = input ? input.value.trim() : '';
      var editId = el.getAttribute('data-id') || null;
      var draft = {
        name: input ? input.value : '',
        server: (document.getElementById('ws-server-input') || {}).value || '',
        captain: (document.getElementById('ws-captain-input') || {}).value || '',
        district: (document.getElementById('ws-district-select') || {}).value || '',
        ward: (document.getElementById('ws-ward-input') || {}).value || '',
        detail: (document.getElementById('ws-detail-input') || {}).value || '',
        notifyBatched: !!(document.getElementById('ws-notify-toggle') || {}).checked
      };
      if (!val) {
        state.modal.draft = draft;
        state.modalError = '請輸入工坊名稱';
      } else if (WORKSHOPS.some(function (w) { return w.name === val && w.id !== editId; })) {
        state.modal.draft = draft;
        state.modalError = '此名稱已存在';
      } else if (!draft.server) {
        state.modal.draft = draft;
        state.modalError = '請選擇遊戲伺服器';
      } else {
        var addr = { district: draft.district, ward: draft.ward, detail: draft.detail };
        if (editId) {
          var target = WORKSHOPS.filter(function (w) { return w.id === editId; })[0];
          if (target) {
            var oldName = target.name;
            target.name = val;
            target.server = draft.server;
            target.captain = draft.captain;
            target.address = addr;
            target.notifyBatched = draft.notifyBatched;
            RAW.forEach(function (r) { if (r.wsName === oldName) r.wsName = val; });
          }
        } else {
          WORKSHOPS.push({ id: 'ws' + (nextWsId++), name: val, server: draft.server, captain: draft.captain, address: addr, notifyBatched: draft.notifyBatched });
        }
        state.modal = null;
        state.modalError = null;
      }
    }
    else if (action === 'auth-login') {
      state.authState = 'processing';
      if (authTimer) clearTimeout(authTimer);
      authTimer = setTimeout(function () {
        state.authState = 'authenticated';
        authTimer = null;
        render();
      }, 1600);
    }
    else if (action === 'auth-retry') { state.authState = 'landing'; }
    else if (action === 'auth-logout') {
      if (authTimer) { clearTimeout(authTimer); authTimer = null; }
      state.authState = 'landing';
      state.route = 'overview';
      state.modal = null;
      state.devOpen = false;
    }
    else if (action === 'dev-toggle') { state.devOpen = !state.devOpen; }
    else if (action === 'dev-auth') {
      if (authTimer) { clearTimeout(authTimer); authTimer = null; }
      state.authState = el.getAttribute('data-state');
      state.devOpen = false;
    }
    else if (action === 'modal-delete-confirm') {
      var delId = el.getAttribute('data-id');
      var delTarget = WORKSHOPS.filter(function (w) { return w.id === delId; })[0];
      if (delTarget) {
        RAW = RAW.filter(function (r) { return r.wsName !== delTarget.name; });
        WORKSHOPS = WORKSHOPS.filter(function (w) { return w.id !== delId; });
        var pi = pagerItems();
        if (state.wsIndex >= pi.length) state.wsIndex = 0;
      }
      state.modal = null;
    }
    else return;
    render();
  });

  document.addEventListener('change', function (e) {
    if (e.target.matches('[data-role="file-input"]')) {
      var f = e.target.files && e.target.files[0];
      handleFile(f ? f.name : null);
    }
  });

  // ---------- Workshop reorder via drag handle (desktop mouse drag) ----------
  document.addEventListener('dragstart', function (e) {
    var handle = e.target.closest('[data-drag-handle]');
    if (!handle) return;
    var row = handle.closest('.ws-row');
    if (!row) return;
    state.dragId = row.getAttribute('data-id');
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', state.dragId); } catch (err) {}
    render();
  });

  document.addEventListener('dragend', function () {
    if (state.dragId !== null) { state.dragId = null; render(); }
  });

  document.addEventListener('drop', function (e) {
    var wsRow = e.target.closest('.ws-row[data-id]');
    if (wsRow && state.dragId !== null) e.preventDefault();
  });

  document.addEventListener('dragover', function (e) {
    var wsRow = e.target.closest('.ws-row[data-id]');
    if (wsRow && state.dragId !== null) {
      e.preventDefault();
      var overId = wsRow.getAttribute('data-id');
      if (overId !== state.dragId) {
        var ids = WORKSHOPS.map(function (w) { return w.id; });
        var fromIdx = ids.indexOf(state.dragId);
        var toIdx = ids.indexOf(overId);
        if (fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx) {
          var moved = WORKSHOPS.splice(fromIdx, 1)[0];
          WORKSHOPS.splice(toIdx, 0, moved);
          render();
        }
      }
      return;
    }
    var dz = e.target.closest('[data-role="dropzone-desktop"]');
    if (!dz) return;
    e.preventDefault();
    if (!state.dragActive) { state.dragActive = true; render(); }
  });
  document.addEventListener('dragleave', function (e) {
    var dz = e.target.closest('[data-role="dropzone-desktop"]');
    if (!dz) return;
    if (state.dragActive) { state.dragActive = false; render(); }
  });
  document.addEventListener('drop', function (e) {
    var dz = e.target.closest('[data-role="dropzone-desktop"]');
    if (!dz) return;
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f ? f.name : null);
  });

  render();
})();
</script>
</body>
</html>
